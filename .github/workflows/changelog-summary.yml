name: User changelog summary

run-name: User changelog summary · ${{ github.event.client_payload.summary_variant || 'all' }} · ${{ github.event.client_payload.start_date }} to ${{ github.event.client_payload.end_date }}

# Public executor. Report files go only to event-frontend's private release.

on:
  repository_dispatch:
    types: [changelog-summary]

permissions:
  contents: read

concurrency:
  group: changelog-summary-${{ github.event.client_payload.summary_variant || 'all' }}-${{ github.event.client_payload.start_date }}-${{ github.event.client_payload.end_date }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      start_date: ${{ steps.ok.outputs.start_date }}
      end_date: ${{ steps.ok.outputs.end_date }}
      output_tag: ${{ steps.ok.outputs.output_tag }}
      summary_members: ${{ steps.ok.outputs.summary_members }}
      summary_variant: ${{ steps.ok.outputs.summary_variant }}
    steps:
      - name: Check the request
        id: ok
        env:
          START_DATE: ${{ github.event.client_payload.start_date }}
          END_DATE: ${{ github.event.client_payload.end_date }}
          OUTPUT_TAG: ${{ github.event.client_payload.output_tag }}
          SUMMARY_MEMBERS: ${{ github.event.client_payload.summary_members }}
          SUMMARY_VARIANT: ${{ github.event.client_payload.summary_variant }}
        run: |
          set -euo pipefail
          for VALUE in "$START_DATE" "$END_DATE"; do
            [[ "$VALUE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || {
              echo '::error::Expected YYYY-MM-DD dates.'; exit 1;
            }
          done
          [[ "$START_DATE" < "$END_DATE" || "$START_DATE" = "$END_DATE" ]] || {
            echo '::error::Start date must not be after end date.'; exit 1;
          }
          [[ -z "$OUTPUT_TAG" || "$OUTPUT_TAG" =~ ^[A-Za-z0-9._-]+$ ]] || {
            echo '::error::Invalid output tag.'; exit 1;
          }
          VARIANT="${SUMMARY_VARIANT:-all}"
          case "$VARIANT" in
            all|scmun|aimcup|oxford|ipdc|ipdc-judge|school|shanghai-debate|sunday-sparring|general-register) ;;
            *) echo '::error::Unknown event variant.'; exit 1 ;;
          esac
          if [ -n "$SUMMARY_MEMBERS" ]; then
            IFS=',' read -ra PARTS <<< "$SUMMARY_MEMBERS"
            SEEN=" "
            for PART in "${PARTS[@]}"; do
              case "$PART" in
                backend|cmsBackend) ;;
                *) echo '::error::Unknown summary member.'; exit 1 ;;
              esac
              case "$SEEN" in
                *" $PART "*) echo '::error::Duplicate summary member.'; exit 1 ;;
              esac
              SEEN="$SEEN$PART "
            done
          fi
          {
            echo "start_date=$START_DATE"
            echo "end_date=$END_DATE"
            echo "output_tag=$OUTPUT_TAG"
            echo "summary_members=$SUMMARY_MEMBERS"
            echo "summary_variant=$VARIANT"
          } >> "$GITHUB_OUTPUT"

  summary:
    needs: check
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/changelog-run.yml
    with:
      mode: changelog-summary
      source_repo: Seechange-edu/event-frontend
      start_date: ${{ needs.check.outputs.start_date }}
      end_date: ${{ needs.check.outputs.end_date }}
      output_tag: ${{ needs.check.outputs.output_tag }}
      summary_members: ${{ needs.check.outputs.summary_members }}
      summary_variant: ${{ needs.check.outputs.summary_variant }}
    secrets: inherit
